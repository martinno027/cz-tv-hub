name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_public.py
      - run: python3 -m unittest discover -s tools
      - run: shellcheck -x scripts/*.sh scripts/lib/*.sh server/deploy/*.sh
      - run: bash server/deploy/health.test.sh
      - run: ./scripts/merge-dev-main.test.sh

  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: PYTHONPATH=src python3 -m unittest discover -s tests
        working-directory: server

  androidtv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The Tailscale bridge AAR (apps/tailnet/build.py android, run by Gradle) needs Go and the runner's NDK.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/tailnet/go.mod
          cache-dependency-path: apps/tailnet/go.sum
      - run: ./gradlew --no-daemon test
        working-directory: apps/androidtv

  tailnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/tailnet/go.mod
          cache-dependency-path: apps/tailnet/go.sum
      - run: go vet -tags ts_omit_logtail ./...
        working-directory: apps/tailnet
      - run: go test -tags ts_omit_logtail ./...
        working-directory: apps/tailnet

  tizen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/*.test.js
        working-directory: apps/tizen

  tvos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: apps/tvos/CTCore
