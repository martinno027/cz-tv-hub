# Source of truth for the Xcode project. Regenerate with: xcodegen generate
name: Televize
options:
  bundleIdPrefix: cz.cztvhub
  # The app is Czech only; declaring it makes system UI (AVKit's player menus, track names) Czech too.
  developmentLanguage: cs
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Put your Apple Developer team id here (or pick the team in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  CTCore:
    path: CTCore
targets:
  Televize:
    type: application
    platform: tvOS
    sources:
      - path: Televize
        excludes:
          - App/BuildStamp.generated.swift
      # Written by the "Stamp build info" phase before compiling; may not exist yet in a fresh clone.
      - path: Televize/App/BuildStamp.generated.swift
        optional: true
    dependencies:
      - package: CTCore
    info:
      path: Televize/Info.plist
      properties:
        CFBundleDisplayName: Televize
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Aplikace hledá ve vaší domácí síti bránu Anténa (DVB-T2).
        NSBonjourServices: [_cztvhub._tcp]
        # The gateway speaks plain HTTP on the home LAN / the household's tailnet only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_NAME: Televize
        PRODUCT_BUNDLE_IDENTIFIER: cz.cztvhub.tv
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        # The version stamp below reads git (outside the sandboxed inputs).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      # Version line in Nastavení (spec/apps.md): build number = git commit count, short commit
      # (+ = uncommitted changes in apps/tvos), build time (Prague), generated as Swift source
      # (gitignored) so it is compiled and signed like any other file. Runs on every build.
      - name: Stamp build info
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Televize/App/BuildStamp.generated.swift
        script: |
          out="${SRCROOT}/Televize/App/BuildStamp.generated.swift"
          cd "${SRCROOT}" || exit 0
          count=$(git rev-list --count HEAD 2>/dev/null) || count="?"
          commit=$(git rev-parse --short HEAD 2>/dev/null) || commit="?"
          if [ "$commit" != "?" ] && [ -n "$(git status --porcelain -- . 2>/dev/null)" ]; then commit="${commit}+"; fi
          built=$(TZ=Europe/Prague date "+%-d. %-m. %H:%M")
          printf '// Generated by the "Stamp build info" build phase (project.yml). Do not edit.\nenum BuildStamp {\n    static let number = "%s"\n    static let commit = "%s"\n    static let time = "%s"\n}\n' \
            "$count" "$commit" "$built" > "$out"
  # Opt-in remote-navigation tests of the guide against a fake gateway (see the test file).
  TelevizeUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [TelevizeUITests]
    dependencies:
      - target: Televize
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.cztvhub.tv.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Televize:
    build:
      targets:
        Televize: all
    run:
      config: Debug
    test:
      targets: [TelevizeUITests]
    archive:
      config: Release
