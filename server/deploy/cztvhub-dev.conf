; Development config for the fake TVHeadend (python3 -m cztvhub dvb-fake). Not for the Pi.
[server]
host = 127.0.0.1         ; dev only: simulators reach it (Android emulator via 10.0.2.2)
port = 8098

[dvb]
enabled = true
key = dev-key-dev-key-dev-key-dev-key-0000
retention_days = 3
hls_dir = /tmp/cztvhub-hls
idle_seconds = 30

[ads]
enabled = true          ; spec/ad-breaks.md; upload test breaks with the worker key (see there)
channels = all
worker_key = dev-worker-dev-worker-dev-worker-00
breaks_dir = /tmp/cztvhub-breaks

[tvheadend]
url = http://127.0.0.1:9981
user = cztvhub
password = fake
